{% if site.enable_tooltips %}
  <!-- Enable Tooltips -->
  <script type="text/javascript">
  $(function () {$('[data-toggle="tooltip"]').tooltip()})
  </script>
{%- endif %}

{%- if site.enable_medium_zoom %}
  <!-- Medium Zoom JS -->
  <script defer src="{{ '/assets/js/lib/medium-zoom-1.0.8.min.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/zoom.js' | relative_url }}"></script>
{%- endif -%}

{% if page.toc and page.toc.sidebar %}
  <!-- Sidebar Table of Contents -->
  <script defer src="{{ '/assets/js/lib/bootstrap-toc-1.0.1.min.js' | relative_url }}"></script>
{% endif %}

  {%- if page.pretty_table %}
  <!-- Bootstrap Table (self-hosted bootstrap-table@1.28.0), only on pages that use it -->
  <script defer src="{{ '/assets/js/lib/bootstrap-table-1.28.0.min.js' | relative_url }}"></script>
  {%- endif %}

  <!-- Load Common JS -->
  <script src="{{ '/assets/js/no_defer.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/common.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/copy_code.js' | relative_url }}" type="text/javascript"></script>
